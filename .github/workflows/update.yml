name: Refresh official VPS offers
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-offer-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and failure boundaries
        run: python -m unittest discover -s tests -v
      - name: Fetch official sources
        run: python scraper.py
      - name: Build static pages
        run: python build.py
      - name: Validate generated pages
        run: python verify.py
      - name: Commit actual data and source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official VPS source data"
            git push
          fi
      - name: Report failed sources after publishing current state
        run: |
          python -c "import json,sys; d=json.load(open('data/offers.json')); bad=[s['provider'] for s in d['sources'] if s['status']!='ok']; print('Failed sources:',bad); sys.exit(bool(bad))"
